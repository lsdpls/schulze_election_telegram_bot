services:
  postgres:
    image: postgres:15.1
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # только для goose с хоста; наружу порт не публикуем
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template
      - /etc/letsencrypt:/etc/letsencrypt
    # шаблону nginx.conf нужны только эти две переменные, секреты из .env сюда не попадают
    environment:
      DOMAIN: ${DOMAIN}
      APP_PORT: ${APP_PORT}
    # nginx резолвит имена upstream при старте и падает, если контейнера ещё нет
    depends_on:
      - bot
      - frontend
    networks:
      - net
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: deploy/dockerfile
    container_name: bot
    expose:
      - "${APP_PORT}"
    volumes:
      - ./logs:/logs
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net
    restart: unless-stopped

  # страница с бюллетенями: nginx отдаёт её по /votes/ и пускает к JSON API бота только её запросы
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    expose:
      - "7070"
    networks:
      - net
    restart: unless-stopped

  # dev: туннель к боту вместо домена (make ngrok-docker → docker compose --profile dev up -d ngrok)
  ngrok:
    image: ngrok/ngrok
    container_name: ngrok
    profiles: ["dev"]
    command: http --url=${NGROK_URL} bot:${APP_PORT}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - bot
    networks:
      - net
    restart: unless-stopped

networks:
  net:
    driver: bridge
