# Шаблон: entrypoint образа nginx подставляет только переменные окружения
# контейнера (${DOMAIN}, ${APP_PORT}); $host, $1 и прочие переменные nginx
# остаются как есть. Файл включается в контекст http{}, поэтому map и
# limit_req_zone здесь допустимы.

# JSON API бота: лимит на IP с запасом на десятки человек за одним NAT (страница делает 3 запроса)
limit_req_zone $binary_remote_addr zone=api:1m rate=30r/s;

# Хост из Referer (без порта и пути), пусто — если Referer нет или он не https
map $http_referer $referer_host {
    default                 "";
    "~^https://([^/:]+)/"   $1;
}

# 1 — запрос пришёл со своей страницы: браузер прислал Sec-Fetch-Site: same-origin
# (все современные браузеры) или Referer с нашего домена (старые браузеры, точное совпадение). Иначе 0.
map "$http_sec_fetch_site $referer_host" $api_from_our_page {
    default            0;
    "~^same-origin "   1;
    " ${DOMAIN}"       1;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name ${DOMAIN};
    server_tokens off;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};
    server_tokens off;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Страница с бюллетенями (frontend/, CRA собран с homepage "/votes", serve -s build).
    # Префикс срезается: /votes/ → frontend:7070/, /votes/static/x.js → /static/x.js
    location = /votes {
        return 301 /votes/;
    }

    location /votes/ {
        proxy_pass http://frontend:7070/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON API бота — только для запросов со своей страницы (см. map выше).
    # Это отсекает случайный прямой доступ (curl, чужие сайты), но заголовки
    # подделываются, поэтому сами данные обязаны оставаться обезличенными:
    # токен вместо делегата, без времени голосования.
    location ~ ^/election_bot/(votes|candidates|result)$ {
        if ($api_from_our_page = 0) {
            return 403;
        }
        limit_req zone=api burst=90 nodelay;
        limit_req_status 429;

        # add_header в location отменяет серверные, поэтому повторяем их здесь
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-store" always;
        # бот шлёт свой Cache-Control: no-store — не дублируем заголовок
        proxy_hide_header Cache-Control;

        # /election_bot/votes → bot:APP_PORT/votes (маршруты в cmd/main.go)
        rewrite ^/election_bot/(.*)$ /$1 break;
        proxy_pass http://bot:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Proxy to Telegram bot
    location /election_bot/ {
        # Только серверы Telegram (core.telegram.org/bots/webhooks): чужой трафик не доходит до бота
        # и не превращается в записи лог-чата. Проверка: make webhook_info → last_error_message
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;
        proxy_pass http://bot:${APP_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
